<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multimedia Player</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 700px;
      margin: 2rem auto;
      padding: 0 1rem;
      background-color: #111827;
      color: #f9fafb;
    }

    h1 {
      text-align: center;
      color: #60a5fa;
      margin-bottom: 2rem;
    }

    section {
      background-color: #1f2937;
      padding: 1.5rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      border: 1px solid #374151;
    }

    h2 {
      margin-top: 0;
      color: #93c5fd;
    }

    audio, video {
      width: 100%;
      border-radius: 6px;
      margin-top: 0.5rem;
    }

    p {
      line-height: 1.6;
      color: #d1d5db;
    }
  </style>
</head>
<body>

  <h1>Multimedia Player</h1>

  <section>
    <h2>Sailing Away</h2>
    <audio controls aria-label="Audio track for Sailing Away">
      <source src="https://cdn.freecodecamp.org/curriculum/js-music-player/sailing-away.mp3" type="audio/mpeg">
    </audio>
  </section>

  <section>
    <h2>What is the map Method and How Does It Work?</h2>
    <video controls width="600" aria-label="Educational video explaining JavaScript map method">
      <source src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4" type="video/mp4">
      <track src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.vtt" kind="subtitles" srclang="en" label="English">
    </video>
  </section>

  <section>
    <h2>Transcript</h2>
    <p>In this video, we explore the JavaScript map method. The map method creates a new array populated with the results of calling a provided function on every element in the calling array.</p>
  </section>

</body>
</html>
